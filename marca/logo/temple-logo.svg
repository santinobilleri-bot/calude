<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500" font-family="'Arial Black','Helvetica Neue',Arial,sans-serif">
  <defs>
    <linearGradient id="navy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#15314f"/>
      <stop offset="1" stop-color="#0c1d30"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a5f86"/>
      <stop offset="1" stop-color="#1c3a5e"/>
    </linearGradient>
    <linearGradient id="copper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e0985f"/>
      <stop offset="0.5" stop-color="#c2703d"/>
      <stop offset="1" stop-color="#9c532a"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1200" height="1500" fill="url(#navy)"/>
  <rect x="40" y="40" width="1120" height="1420" fill="none" stroke="#1c3a5e" stroke-width="2" opacity="0.6"/>

  <!-- ============ MONOGRAM BADGE (hexagon + T + spark) ============ -->
  <g transform="translate(600,300)" filter="url(#soft)">
    <!-- hexagon outer -->
    <polygon points="0,-150 130,-75 130,75 0,150 -130,75 -130,-75"
             fill="url(#steel)" stroke="#0c1d30" stroke-width="6"/>
    <!-- hexagon inner bevel -->
    <polygon points="0,-120 104,-60 104,60 0,120 -104,60 -104,-60"
             fill="#102a44" stroke="#4a7099" stroke-width="2"/>
    <!-- copper inner hairline -->
    <polygon points="0,-104 90,-52 90,52 0,104 -90,52 -90,-52"
             fill="none" stroke="#c2703d" stroke-width="2" opacity="0.85"/>
    <!-- T monogram -->
    <g fill="#F2EFE9">
      <rect x="-62" y="-58" width="124" height="26" rx="3"/>
      <rect x="-15" y="-58" width="30" height="118" rx="3"/>
    </g>
    <!-- copper spark/ember above the T -->
    <g fill="url(#copper)">
      <polygon points="0,-86 8,-70 0,-54 -8,-70"/>
    </g>
  </g>

  <!-- ============ PRIMARY WORDMARK (stacked) ============ -->
  <g transform="translate(600,560)" text-anchor="middle">
    <text y="0" font-size="150" letter-spacing="14" fill="#F2EFE9" font-weight="900">TEMPLE</text>
    <!-- copper divider with spark -->
    <g transform="translate(0,46)">
      <rect x="-250" y="-2" width="210" height="4" fill="#c2703d"/>
      <rect x="40" y="-2" width="210" height="4" fill="#c2703d"/>
      <polygon points="0,-12 14,0 0,12 -14,0" fill="url(#copper)"/>
    </g>
    <text y="108" font-size="46" letter-spacing="26" fill="#c2703d" font-weight="700">VITALITY</text>
  </g>

  <!-- ============ HORIZONTAL LOCKUP ============ -->
  <g transform="translate(150,800)">
    <!-- mini badge -->
    <g transform="translate(80,40) scale(0.5)">
      <polygon points="0,-150 130,-75 130,75 0,150 -130,75 -130,-75" fill="url(#steel)" stroke="#0c1d30" stroke-width="6"/>
      <polygon points="0,-104 90,-52 90,52 0,104 -90,52 -90,-52" fill="none" stroke="#c2703d" stroke-width="3" opacity="0.85"/>
      <g fill="#F2EFE9"><rect x="-62" y="-58" width="124" height="26" rx="3"/><rect x="-15" y="-58" width="30" height="118" rx="3"/></g>
      <polygon points="0,-86 8,-70 0,-54 -8,-70" fill="url(#copper)"/>
    </g>
    <text x="180" y="20" font-size="84" letter-spacing="8" fill="#F2EFE9" font-weight="900">TEMPLE</text>
    <text x="184" y="66" font-size="26" letter-spacing="17" fill="#c2703d" font-weight="700">VITALITY</text>
  </g>

  <!-- ============ AVATAR / MONOGRAM ONLY (on copper + on bone) ============ -->
  <g transform="translate(330,1130)">
    <text x="0" y="-70" font-size="28" letter-spacing="4" fill="#7f94aa" font-weight="700" text-anchor="middle">AVATAR</text>
    <circle cx="0" cy="40" r="110" fill="#0c1d30" stroke="#c2703d" stroke-width="3"/>
    <g transform="scale(0.62)" >
      <g transform="translate(0,64)" fill="#F2EFE9"><rect x="-62" y="-58" width="124" height="26" rx="3"/><rect x="-15" y="-58" width="30" height="118" rx="3"/></g>
      <polygon points="0,-22 8,-6 0,10 -8,-6" fill="url(#copper)"/>
    </g>
  </g>

  <!-- negative / on light -->
  <g transform="translate(700,1130)">
    <text x="0" y="-70" font-size="28" letter-spacing="4" fill="#7f94aa" font-weight="700" text-anchor="middle">NEGATIVO</text>
    <circle cx="0" cy="40" r="110" fill="#F2EFE9"/>
    <g transform="scale(0.62)">
      <g transform="translate(0,64)" fill="#10243B"><rect x="-62" y="-58" width="124" height="26" rx="3"/><rect x="-15" y="-58" width="30" height="118" rx="3"/></g>
      <polygon points="0,-22 8,-6 0,10 -8,-6" fill="url(#copper)"/>
    </g>
  </g>

  <!-- color swatches -->
  <g transform="translate(150,1370)">
    <rect x="0"   y="0" width="120" height="60" fill="#10243B"/><text x="0" y="80" font-size="18" fill="#cdd6df" font-weight="700">#10243B</text>
    <rect x="160" y="0" width="120" height="60" fill="#1C3A5E"/><text x="160" y="80" font-size="18" fill="#cdd6df" font-weight="700">#1C3A5E</text>
    <rect x="320" y="0" width="120" height="60" fill="#C2703D"/><text x="320" y="80" font-size="18" fill="#cdd6df" font-weight="700">#C2703D</text>
    <rect x="480" y="0" width="120" height="60" fill="#F2EFE9"/><text x="480" y="80" font-size="18" fill="#cdd6df" font-weight="700">#F2EFE9</text>
    <text x="780" y="40" font-size="22" fill="#7f94aa" font-weight="700">TEMPLE · sistema de logo v1</text>
  </g>
</svg>
