<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500" font-family="'Arial Black','Helvetica Neue',Arial,sans-serif">
  <defs>
    <linearGradient id="navy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#15314f"/>
      <stop offset="1" stop-color="#0c1d30"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a5f86"/>
      <stop offset="1" stop-color="#1c3a5e"/>
    </linearGradient>
    <linearGradient id="copper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e0985f"/>
      <stop offset="0.5" stop-color="#c2703d"/>
      <stop offset="1" stop-color="#9c532a"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1200" height="1500" fill="url(#navy)"/>
  <rect x="40" y="40" width="1120" height="1420" fill="none" stroke="#1c3a5e" stroke-width="2" opacity="0.6"/>

  <!-- ============ MONOGRAM BADGE (hexagon + P + copper accent) ============ -->
  <g transform="translate(600,290)" filter="url(#soft)">
    <polygon points="0,-150 130,-75 130,75 0,150 -130,75 -130,-75"
             fill="url(#steel)" stroke="#0c1d30" stroke-width="6"/>
    <polygon points="0,-120 104,-60 104,60 0,120 -104,60 -104,-60"
             fill="#102a44" stroke="#4a7099" stroke-width="2"/>
    <polygon points="0,-104 90,-52 90,52 0,104 -90,52 -90,-52"
             fill="none" stroke="#c2703d" stroke-width="2" opacity="0.85"/>
    <!-- P monogram -->
    <text x="0" y="58" font-size="170" font-weight="900" fill="#F2EFE9" text-anchor="middle">P</text>
    <!-- copper accent / spark, top-right of the P -->
    <polygon points="44,-66 60,-46 40,-30 30,-50" fill="url(#copper)"/>
  </g>

  <!-- ============ PRIMARY WORDMARK (P Ú R O, accent in copper) ============ -->
  <g transform="translate(0,560)" font-size="180" font-weight="900">
    <text x="360" y="0" fill="#F2EFE9" text-anchor="middle">P</text>
    <text x="540" y="0" fill="#F2EFE9" text-anchor="middle">U</text>
    <text x="720" y="0" fill="#F2EFE9" text-anchor="middle">R</text>
    <text x="900" y="0" fill="#F2EFE9" text-anchor="middle">O</text>
    <!-- COPPER ACCENT over the U -->
    <polygon points="524,-150 556,-150 540,-110 520,-110" fill="url(#copper)"/>
    <!-- divider + spark + bajada -->
    <g transform="translate(630,70)">
      <rect x="-250" y="-2" width="210" height="4" fill="#c2703d"/>
      <rect x="40" y="-2" width="210" height="4" fill="#c2703d"/>
      <polygon points="0,-12 14,0 0,12 -14,0" fill="url(#copper)"/>
    </g>
    <text x="630" y="138" font-size="42" letter-spacing="22" fill="#c2703d" font-weight="700" text-anchor="middle">VITALITY</text>
  </g>

  <!-- ============ HORIZONTAL LOCKUP ============ -->
  <g transform="translate(160,800)">
    <g transform="translate(80,40) scale(0.5)">
      <polygon points="0,-150 130,-75 130,75 0,150 -130,75 -130,-75" fill="url(#steel)" stroke="#0c1d30" stroke-width="6"/>
      <polygon points="0,-104 90,-52 90,52 0,104 -90,52 -90,-52" fill="none" stroke="#c2703d" stroke-width="3" opacity="0.85"/>
      <text x="0" y="58" font-size="170" font-weight="900" fill="#F2EFE9" text-anchor="middle">P</text>
      <polygon points="44,-66 60,-46 40,-30 30,-50" fill="url(#copper)"/>
    </g>
    <text x="170" y="20" font-size="92" font-weight="900" fill="#F2EFE9">PURO</text>
    <polygon points="262,-78 286,-78 274,-50 256,-50" fill="url(#copper)"/>
    <text x="174" y="64" font-size="24" letter-spacing="15" fill="#c2703d" font-weight="700">VITALITY</text>
  </g>

  <!-- ============ AVATAR + NEGATIVO ============ -->
  <g transform="translate(330,1130)">
    <text x="0" y="-70" font-size="28" letter-spacing="4" fill="#7f94aa" font-weight="700" text-anchor="middle">AVATAR</text>
    <circle cx="0" cy="40" r="110" fill="#0c1d30" stroke="#c2703d" stroke-width="3"/>
    <text x="0" y="98" font-size="150" font-weight="900" fill="#F2EFE9" text-anchor="middle">P</text>
    <polygon points="34,-2 52,20 30,36 20,12" fill="url(#copper)"/>
  </g>
  <g transform="translate(700,1130)">
    <text x="0" y="-70" font-size="28" letter-spacing="4" fill="#7f94aa" font-weight="700" text-anchor="middle">NEGATIVO</text>
    <circle cx="0" cy="40" r="110" fill="#F2EFE9"/>
    <text x="0" y="98" font-size="150" font-weight="900" fill="#10243B" text-anchor="middle">P</text>
    <polygon points="34,-2 52,20 30,36 20,12" fill="url(#copper)"/>
  </g>

  <!-- color swatches -->
  <g transform="translate(160,1360)">
    <rect x="0"   y="0" width="120" height="56" fill="#10243B"/><text x="0" y="78" font-size="18" fill="#cdd6df" font-weight="700">#10243B</text>
    <rect x="160" y="0" width="120" height="56" fill="#1C3A5E"/><text x="160" y="78" font-size="18" fill="#cdd6df" font-weight="700">#1C3A5E</text>
    <rect x="320" y="0" width="120" height="56" fill="#C2703D"/><text x="320" y="78" font-size="18" fill="#cdd6df" font-weight="700">#C2703D</text>
    <rect x="480" y="0" width="120" height="56" fill="#F2EFE9"/><text x="480" y="78" font-size="18" fill="#cdd6df" font-weight="700">#F2EFE9</text>
    <text x="760" y="36" font-size="22" fill="#7f94aa" font-weight="700">PÚRO · sistema de logo v1</text>
  </g>
</svg>
