<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 220" role="img" aria-label="PÚRO Vitality Boost">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8c97a"/>
      <stop offset="0.5" stop-color="#c9a24b"/>
      <stop offset="1" stop-color="#9c7a30"/>
    </linearGradient>
  </defs>
  <rect width="560" height="220" fill="#0E0E0E"/>
  <!-- Wordmark PURO -->
  <text x="280" y="120" font-size="118" text-anchor="middle" letter-spacing="10"
        font-family="'Arial Black','Helvetica Neue',Arial,sans-serif" font-weight="900"
        fill="url(#gold)">PURO</text>
  <!-- Tilde dorada estilizada (acento/energía) sobre la U -->
  <g transform="translate(232,40)">
    <path d="M0 16 C 12 0, 34 -2, 46 8 C 32 6, 16 11, 0 16 Z" fill="url(#gold)"/>
  </g>
  <!-- Descriptor -->
  <text x="280" y="162" font-size="22" text-anchor="middle" fill="#F2EFE9"
        font-family="'Helvetica Neue',Arial,sans-serif" font-weight="600" letter-spacing="12">VITALITY BOOST</text>
  <!-- Línea inferior -->
  <text x="280" y="192" font-size="13" text-anchor="middle" fill="#C9A24B"
        font-family="'Helvetica Neue',Arial,sans-serif" letter-spacing="6">FORMULADO PARA HOMBRES · SISTEMA T6</text>
</svg>
