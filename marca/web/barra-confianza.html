<style>
.puro-tr{background:#ffffff;max-width:560px;margin:0 auto;padding:10px 12px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;box-sizing:border-box;}
.puro-tr *{box-sizing:border-box}
/* stock */
.puro-tr-stock{display:flex;align-items:center;gap:9px;background:#fdf3f3;border:1px solid #f1d2d2;border-radius:10px;padding:8px 12px;margin-bottom:10px;}
.puro-tr-dot{width:11px;height:11px;background:#C75A5A;border-radius:50%;flex-shrink:0;animation:puroPulseStock 1.4s infinite;}
.puro-tr-stock p{margin:0;font-size:13px;line-height:1.2;color:#0B2747;font-weight:600}
.puro-tr-stock b{font-weight:900;color:#C75A5A}
@keyframes puroPulseStock{0%{box-shadow:0 0 0 0 rgba(199,90,90,.45)}70%{box-shadow:0 0 0 8px rgba(199,90,90,0)}100%{box-shadow:0 0 0 0 rgba(199,90,90,0)}}
/* trust row */
.puro-tr-items{display:flex;flex-wrap:wrap;justify-content:center;gap:7px 16px;margin-bottom:9px;}
.puro-tr-items span{display:inline-flex;align-items:center;gap:5px;color:#0B2747;font-size:12px;font-weight:700;}
/* pay badges */
.puro-tr-pay{display:flex;justify-content:center;align-items:center;gap:7px;flex-wrap:wrap;}
.puro-pb{height:26px;border:1px solid #e6eaee;border-radius:5px;background:#fff;padding:0 9px;display:inline-flex;align-items:center;font-size:11px;font-weight:900;letter-spacing:.3px;}
.puro-pb.visa{color:#1a1f71;font-style:italic}
.puro-pb.amex{background:#2e77bc;color:#fff;border-color:#2e77bc}
.puro-pb.apple{background:#000;color:#fff;border-color:#000}
.puro-pb.mc{gap:0;padding:0 8px}
.puro-pb.mc i{width:15px;height:15px;border-radius:50%;display:inline-block}
.puro-pb.mc i.r{background:#EB001B}
.puro-pb.mc i.o{background:#F79E1B;margin-left:-6px;opacity:.92}
</style>

<section class="puro-tr">
  <div class="puro-tr-stock">
    <span class="puro-tr-dot"></span>
    <p><b>¡Atención!</b> Quedan <b>18 unidades</b> de este lote.</p>
  </div>

  <div class="puro-tr-items">
    <span>🔒 Compra protegida</span>
    <span>💳 Hasta 3 cuotas</span>
    <span>🇦🇷 Envío a todo el país</span>
  </div>

  <div class="puro-tr-pay">
    <span class="puro-pb visa">VISA</span>
    <span class="puro-pb mc"><i class="r"></i><i class="o"></i></span>
    <span class="puro-pb apple">Apple&nbsp;Pay</span>
    <span class="puro-pb amex">AMEX</span>
  </div>
</section>
