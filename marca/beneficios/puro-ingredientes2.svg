  <text x="540" y="1008" text-anchor="middle" font-size="28" font-weight="800" fill="#F8F6F0">1 al día · Natural, sin hormonas</text>
  <text x="540" y="1046" text-anchor="middle" font-size="21" letter-spacing="2" font-weight="600" fill="#7fa6d8">SUPLEMENTO DIETARIO · INDUSTRIA ARGENTINA</text>
