<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" font-family="Outfit, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#15314f"/><stop offset="1" stop-color="#0a1726"/>
    </linearGradient>
    <radialGradient id="spot" cx="82%" cy="62%" r="50%">
      <stop offset="0" stop-color="#2E6BD6" stop-opacity="0.40"/>
      <stop offset="1" stop-color="#0a1726" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0b878"/><stop offset="1" stop-color="#d98a3f"/>
    </linearGradient>
    <filter id="cardsh" x="-20%" y="-20%" width="140%" height="170%">
      <feDropShadow dx="0" dy="7" stdDeviation="12" flood-color="#000" flood-opacity="0.30"/>
    </filter>
  </defs>

  <rect width="1080" height="1080" fill="url(#bg)"/>
  <rect width="1080" height="1080" fill="url(#spot)"/>

  <!-- bottle floating lower-right (más chico, no aprieta) -->
  <image href="bottle-cutout.png" x="740" y="430" width="345" height="586" preserveAspectRatio="xMidYMax meet"/>

  <!-- kicker -->
  <g transform="translate(60,86)">
    <circle cx="10" cy="-10" r="10" fill="url(#amber)"/>
    <text x="34" y="0" font-size="30" font-weight="700" fill="#cfe0f2">+10.000 hombres ya hicieron el cambio</text>
  </g>

  <!-- headline -->
  <g font-weight="800" font-size="80">
    <text x="58" y="208" fill="#F8F6F0">Menos panza.</text>
    <text x="58" y="304" fill="#F8F6F0">Más energía.</text>
    <text x="58" y="400" fill="#f0b878">Más ganas.</text>
  </g>

  <!-- subhead -->
  <text x="60" y="470" font-size="34" font-weight="600" fill="#bcd0e6">Volvé a sentirte el hombre que eras.</text>

  <!-- benefit cards 2x2 con más aire -->
  <g filter="url(#cardsh)">
    <g transform="translate(60,540)">
      <rect width="300" height="146" rx="24" fill="#ffffff"/>
      <text x="30" y="62" font-size="34" font-weight="800" fill="#d57e34">ENERGÍA</text>
      <text x="30" y="106" font-size="27" font-weight="600" fill="#23364d">Adiós a los bajones</text>
    </g>
    <g transform="translate(390,540)">
      <rect width="300" height="146" rx="24" fill="#ffffff"/>
      <text x="30" y="62" font-size="32" font-weight="800" fill="#d57e34">METABOLISMO</text>
      <text x="30" y="106" font-size="27" font-weight="600" fill="#23364d">Apoyá tu figura</text>
    </g>
    <g transform="translate(60,724)">
      <rect width="300" height="146" rx="24" fill="#ffffff"/>
      <text x="30" y="62" font-size="34" font-weight="800" fill="#d57e34">GANAS</text>
      <text x="30" y="106" font-size="27" font-weight="600" fill="#23364d">Volvé a sentirte vos</text>
    </g>
    <g transform="translate(390,724)">
      <rect width="300" height="146" rx="24" fill="#ffffff"/>
      <text x="30" y="62" font-size="34" font-weight="800" fill="#d57e34">DESCANSO</text>
      <text x="30" y="106" font-size="27" font-weight="600" fill="#23364d">Menos estrés</text>
    </g>
  </g>

  <!-- CTA -->
  <g transform="translate(60,918)">
    <rect width="372" height="78" rx="39" fill="url(#amber)"/>
    <text x="186" y="51" text-anchor="middle" font-size="30" font-weight="800" fill="#0a1726">QUIERO VOLVER A SER YO</text>
  </g>
  <!-- trust -->
  <text x="62" y="1042" font-size="23" font-weight="700" fill="#cfe0f2">100% Natural · Sin hormonas · 1 al día</text>
</svg>
