<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" font-family="Outfit, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#15314f"/><stop offset="1" stop-color="#0a1726"/>
    </linearGradient>
    <radialGradient id="spot" cx="80%" cy="58%" r="52%">
      <stop offset="0" stop-color="#2E6BD6" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#0a1726" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0b878"/><stop offset="1" stop-color="#d98a3f"/>
    </linearGradient>
    <filter id="cardsh" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.30"/>
    </filter>
  </defs>

  <rect width="1080" height="1080" fill="url(#bg)"/>
  <rect width="1080" height="1080" fill="url(#spot)"/>

  <!-- bottle floating right -->
  <image href="bottle-cutout.png" x="700" y="338" width="400" height="679" preserveAspectRatio="xMidYMax meet"/>

  <!-- kicker -->
  <g transform="translate(56,72)">
    <circle cx="9" cy="-9" r="9" fill="url(#amber)"/>
    <text x="30" y="0" font-size="29" font-weight="700" fill="#cfe0f2">+10.000 hombres ya hicieron el cambio</text>
  </g>

  <!-- headline: 3 punchy hits -->
  <g font-weight="800" font-size="82">
    <text x="54" y="195" fill="#F8F6F0">Menos panza.</text>
    <text x="54" y="288" fill="#F8F6F0">Más energía.</text>
    <text x="54" y="381" fill="#f0b878">Más ganas.</text>
  </g>

  <!-- subhead -->
  <text x="56" y="446" font-size="33" font-weight="600" fill="#bcd0e6">Volvé a sentirte el hombre que eras.</text>

  <!-- benefit cards 2x2 (más aire) -->
  <g filter="url(#cardsh)">
    <g transform="translate(56,512)">
      <rect width="288" height="150" rx="22" fill="#ffffff"/>
      <text x="28" y="60" font-size="33" font-weight="800" fill="#d57e34">ENERGÍA</text>
      <text x="28" y="104" font-size="26" font-weight="600" fill="#23364d">Adiós a los bajones</text>
    </g>
    <g transform="translate(372,512)">
      <rect width="288" height="150" rx="22" fill="#ffffff"/>
      <text x="28" y="60" font-size="33" font-weight="800" fill="#d57e34">FIGURA</text>
      <text x="28" y="104" font-size="26" font-weight="600" fill="#23364d">Apoyá tu metabolismo</text>
    </g>
    <g transform="translate(56,688)">
      <rect width="288" height="150" rx="22" fill="#ffffff"/>
      <text x="28" y="60" font-size="33" font-weight="800" fill="#d57e34">GANAS</text>
      <text x="28" y="104" font-size="26" font-weight="600" fill="#23364d">Volvé a sentirte vos</text>
    </g>
    <g transform="translate(372,688)">
      <rect width="288" height="150" rx="22" fill="#ffffff"/>
      <text x="28" y="60" font-size="33" font-weight="800" fill="#d57e34">DESCANSO</text>
      <text x="28" y="104" font-size="26" font-weight="600" fill="#23364d">Menos estrés</text>
    </g>
  </g>

  <!-- CTA + trust -->
  <g transform="translate(56,890)">
    <rect width="360" height="76" rx="38" fill="url(#amber)"/>
    <text x="180" y="50" text-anchor="middle" font-size="30" font-weight="800" fill="#0a1726">QUIERO VOLVER A SER YO</text>
  </g>
  <text x="56" y="1024" font-size="24" font-weight="700" fill="#cfe0f2">100% Natural · Sin hormonas · 1 al día · Industria Argentina</text>
</svg>
