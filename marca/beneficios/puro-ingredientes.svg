<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" font-family="Outfit, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#15314f"/><stop offset="1" stop-color="#0a1726"/>
    </linearGradient>
    <radialGradient id="spot" cx="50%" cy="52%" r="42%">
      <stop offset="0" stop-color="#2E6BD6" stop-opacity="0.40"/>
      <stop offset="1" stop-color="#0a1726" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0b878"/><stop offset="1" stop-color="#d98a3f"/>
    </linearGradient>
  </defs>

  <rect width="1080" height="1080" fill="url(#bg)"/>
  <rect width="1080" height="1080" fill="url(#spot)"/>

  <!-- title -->
  <text x="540" y="86" text-anchor="middle" font-size="46" font-weight="800" fill="#F8F6F0">LO QUE LLEVA <tspan font-style="italic" fill="#f0b878">PÚRO</tspan></text>
  <text x="540" y="128" text-anchor="middle" font-size="25" font-weight="500" fill="#9fb6cf">Sin fórmulas secretas: cada activo, a la vista.</text>

  <!-- bottle center -->
  <image href="bottle-cutout.png" x="392" y="250" width="296" height="560" preserveAspectRatio="xMidYMid meet"/>

  <!-- connectors -->
  <g stroke="#3a6da6" stroke-width="2" fill="none" opacity="0.7">
    <path d="M372 360 L430 380"/><path d="M372 520 L420 520"/><path d="M372 680 L430 655"/>
    <path d="M708 360 L650 380"/><path d="M708 520 L660 520"/><path d="M708 680 L650 655"/>
  </g>
  <g fill="#f0b878">
    <circle cx="372" cy="360" r="6"/><circle cx="372" cy="520" r="6"/><circle cx="372" cy="680" r="6"/>
    <circle cx="708" cy="360" r="6"/><circle cx="708" cy="520" r="6"/><circle cx="708" cy="680" r="6"/>
  </g>

  <!-- LEFT callouts (text-anchor end) -->
  <g text-anchor="end">
    <text x="352" y="352" font-size="31" font-weight="800" fill="#ffffff">MACA · 500 mg</text>
    <text x="352" y="386" font-size="22" font-weight="500" fill="#a9c0d8">Energía y vitalidad</text>

    <text x="352" y="512" font-size="27" font-weight="800" fill="#ffffff">ASHWAGANDHA · 600 mg</text>
    <text x="352" y="546" font-size="22" font-weight="500" fill="#a9c0d8">Menos estrés, mejor descanso</text>

    <text x="352" y="672" font-size="31" font-weight="800" fill="#ffffff">TÉ VERDE · 250 mg</text>
    <text x="352" y="706" font-size="22" font-weight="500" fill="#a9c0d8">Apoya el metabolismo</text>
  </g>

  <!-- RIGHT callouts (text-anchor start) -->
  <g text-anchor="start">
    <text x="728" y="352" font-size="31" font-weight="800" fill="#ffffff">ZINC · 15 mg</text>
    <text x="728" y="386" font-size="22" font-weight="500" fill="#a9c0d8">Equilibrio hormonal masculino</text>

    <text x="728" y="512" font-size="31" font-weight="800" fill="#ffffff">MAGNESIO · 200 mg</text>
    <text x="728" y="546" font-size="22" font-weight="500" fill="#a9c0d8">Menos fatiga</text>

    <text x="728" y="672" font-size="28" font-weight="800" fill="#ffffff">VITAMINA D3 · 1000 UI</text>
    <text x="728" y="706" font-size="22" font-weight="500" fill="#a9c0d8">Músculo e inmunidad</text>
  </g>

  <!-- footer -->
  <rect x="0" y="956" width="1080" height="124" fill="#0a1726"/>
  <text x="540" y="1006" text-anchor="middle" font-size="28" font-weight="800" fill="#F8F6F0">1 al día · Natural, sin hormonas</text>
  <text x="540" y="1044" text-anchor="middle" font-size="21" letter-spacing="2" font-weight="600" fill="#7fa6d8">SUPLEMENTO DIETARIO · INDUSTRIA ARGENTINA</text>
</svg>
