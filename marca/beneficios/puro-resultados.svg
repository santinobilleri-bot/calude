<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" font-family="Outfit, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16314e"/><stop offset="1" stop-color="#091625"/>
    </linearGradient>
    <radialGradient id="glow" cx="78%" cy="52%" r="42%">
      <stop offset="0" stop-color="#2E6BD6" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#091625" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0b878"/><stop offset="1" stop-color="#d98a3f"/>
    </linearGradient>
    <g id="star"><polygon points="11,2 13.6,8.2 20,8.6 15,12.8 16.7,19 11,15.4 5.3,19 7,12.8 2,8.6 8.4,8.2" fill="#f0b878"/></g>
    <g id="chk"><circle cx="24" cy="24" r="24" fill="url(#amber)"/><path d="M13 24 l7 7 l15 -16" fill="none" stroke="#0a1726" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g>
    <g id="cap"><rect x="-38" y="-15" width="76" height="30" rx="15" fill="#7a2f1e"/><rect x="0" y="-15" width="38" height="30" rx="15" fill="#b5612f"/><rect x="-38" y="-15" width="76" height="30" rx="15" fill="none" stroke="#0a1726" stroke-width="2"/></g>
  </defs>

  <rect width="1080" height="1080" fill="url(#bg)"/>
  <rect width="1080" height="1080" fill="url(#glow)"/>

  <!-- header -->
  <g transform="translate(56,84)">
    <text x="0" y="0" font-size="42" font-style="italic" font-weight="800" fill="#F8F6F0">PÚRO</text>
    <polygon points="33,-42 49,-56 57,-49 41,-35" fill="url(#amber)"/>
  </g>
  <g transform="translate(842,56)">
    <use href="#star" x="0"/><use href="#star" x="30"/><use href="#star" x="60"/><use href="#star" x="90"/><use href="#star" x="120"/>
    <text x="71" y="46" text-anchor="middle" font-size="18" letter-spacing="1" font-weight="700" fill="#8fb0d4">+10.000 hombres</text>
  </g>

  <!-- headline -->
  <text x="56" y="232" font-size="58" font-weight="800" fill="#F8F6F0">RESULTADOS</text>
  <text x="56" y="296" font-size="58" font-weight="800" fill="#F8F6F0">QUE <tspan fill="#f0b878">SE SIENTEN</tspan></text>
  <rect x="58" y="324" width="130" height="6" rx="3" fill="url(#amber)"/>

  <!-- capsules floating -->
  <use href="#cap" x="0" y="0" transform="translate(905,250) rotate(-28)"/>
  <use href="#cap" x="0" y="0" transform="translate(660,540) rotate(35)"/>
  <use href="#cap" x="0" y="0" transform="translate(980,720) rotate(18)"/>

  <!-- bottle -->
  <image href="bottle-cutout.png" x="700" y="360" width="360" height="612" preserveAspectRatio="xMidYMax meet"/>

  <!-- benefits -->
  <g transform="translate(56,400)">
    <use href="#chk" x="0" y="0"/>
    <text x="70" y="22" font-size="33" font-weight="800" fill="#ffffff">Más energía</text>
    <text x="70" y="56" font-size="22" font-weight="500" fill="#a9c0d8">De la mañana a la noche, sin bajones.</text>
  </g>
  <g transform="translate(56,520)">
    <use href="#chk" x="0" y="0"/>
    <text x="70" y="22" font-size="33" font-weight="800" fill="#ffffff">Metabolismo y figura</text>
    <text x="70" y="56" font-size="22" font-weight="500" fill="#a9c0d8">Apoya tu metabolismo día a día.</text>
  </g>
  <g transform="translate(56,640)">
    <use href="#chk" x="0" y="0"/>
    <text x="70" y="22" font-size="33" font-weight="800" fill="#ffffff">Vitalidad y ganas</text>
    <text x="70" y="56" font-size="22" font-weight="500" fill="#a9c0d8">Volvé a sentirte el de antes.</text>
  </g>
  <g transform="translate(56,760)">
    <use href="#chk" x="0" y="0"/>
    <text x="70" y="22" font-size="33" font-weight="800" fill="#ffffff">Mejor descanso</text>
    <text x="70" y="56" font-size="22" font-weight="500" fill="#a9c0d8">Menos estrés, dormís mejor.</text>
  </g>

  <!-- footer -->
  <rect x="0" y="966" width="1080" height="114" fill="#070f1a"/>
  <text x="540" y="1014" text-anchor="middle" font-size="26" font-weight="800" fill="#F8F6F0">Natural · Sin hormonas · 1 cápsula al día</text>
  <text x="540" y="1050" text-anchor="middle" font-size="20" letter-spacing="2" font-weight="600" fill="#7fa6d8">SUPLEMENTO DIETARIO · INDUSTRIA ARGENTINA</text>
</svg>
