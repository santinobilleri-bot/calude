<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" font-family="Outfit, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#13293f"/><stop offset="1" stop-color="#070f1a"/>
    </linearGradient>
    <radialGradient id="glow" cx="20%" cy="50%" r="40%">
      <stop offset="0" stop-color="#2E6BD6" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#070f1a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3c98a"/><stop offset="1" stop-color="#d98a3f"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg)"/>
  <rect width="1080" height="1080" fill="url(#glow)"/>

  <!-- bottle hero left -->
  <image href="bottle-cutout.png" x="20" y="250" width="400" height="700" preserveAspectRatio="xMidYMid meet"/>

  <!-- header right -->
  <text x="452" y="118" font-size="24" letter-spacing="5" font-weight="700" fill="#f0b878">FÓRMULA NATURAL</text>
  <text x="450" y="178" font-size="46" font-weight="800" fill="#F8F6F0">LO QUE LLEVA</text>
  <text x="450" y="230" font-size="46" font-weight="800" fill="#F8F6F0">CADA CÁPSULA</text>
  <rect x="452" y="256" width="120" height="5" rx="2.5" fill="url(#amber)"/>

  <!-- rows -->
  <!-- MACA -->
  <g transform="translate(452,322)">
    <circle cx="42" cy="20" r="42" fill="#0f2740" stroke="url(#amber)" stroke-width="3"/>
    <g transform="translate(42,20)"><ellipse cx="0" cy="-3" rx="15" ry="19" fill="#e0a35c"/><path d="M-7,15 q-2,9-4,13 M2,17 q0,9 1,13 M8,13 q3,8 6,11" stroke="#c98f4f" stroke-width="3" fill="none" stroke-linecap="round"/></g>
    <text x="108" y="12" font-size="29" font-weight="800" fill="#ffffff">MACA <tspan fill="#f0b878">· 500 mg</tspan></text>
    <text x="108" y="44" font-size="22" font-weight="500" fill="#aabfd4">Energía y vitalidad</text>
  </g>
  <!-- ASHWAGANDHA -->
  <g transform="translate(452,440)">
    <circle cx="42" cy="20" r="42" fill="#0f2740" stroke="url(#amber)" stroke-width="3"/>
    <g transform="translate(42,20)"><path d="M-13,-16 q6,-8 13,0 q6,-8 13,0 q-2,9-13,11 q-11,-2-13,-11 Z" fill="#6fbf73"/><ellipse cx="0" cy="6" rx="11" ry="16" fill="#d9b389"/><circle cx="-13" cy="0" r="4.5" fill="#d8533e"/><circle cx="13" cy="-2" r="4.5" fill="#d8533e"/></g>
    <text x="108" y="12" font-size="29" font-weight="800" fill="#ffffff">ASHWAGANDHA <tspan fill="#f0b878">· 600 mg</tspan></text>
    <text x="108" y="44" font-size="22" font-weight="500" fill="#aabfd4">Menos estrés, mejor descanso</text>
  </g>
  <!-- TE VERDE -->
  <g transform="translate(452,558)">
    <circle cx="42" cy="20" r="42" fill="#0f2740" stroke="url(#amber)" stroke-width="3"/>
    <g transform="translate(42,20)"><path d="M-1,24 C-20,12-20,-16 3,-24 C21,-12 18,15-1,24 Z" fill="#5fb16a"/><path d="M-1,22 C-3,6 0,-10 3,-22" stroke="#2f7d43" stroke-width="2.5" fill="none"/></g>
    <text x="108" y="12" font-size="29" font-weight="800" fill="#ffffff">TÉ VERDE <tspan fill="#f0b878">· 250 mg</tspan></text>
    <text x="108" y="44" font-size="22" font-weight="500" fill="#aabfd4">Apoya el metabolismo</text>
  </g>
  <!-- ZINC -->
  <g transform="translate(452,676)">
    <circle cx="42" cy="20" r="42" fill="#0f2740" stroke="url(#amber)" stroke-width="3"/>
    <g transform="translate(42,20)"><polygon points="0,-26 22,-13 22,13 0,26 -22,13 -22,-13" fill="none" stroke="url(#amber)" stroke-width="4"/><text x="0" y="9" text-anchor="middle" font-size="26" font-weight="800" fill="#f0b878">Zn</text></g>
    <text x="108" y="12" font-size="29" font-weight="800" fill="#ffffff">ZINC <tspan fill="#f0b878">· 15 mg</tspan></text>
    <text x="108" y="44" font-size="22" font-weight="500" fill="#aabfd4">Equilibrio hormonal masculino</text>
  </g>
  <!-- MAGNESIO -->
  <g transform="translate(452,794)">
    <circle cx="42" cy="20" r="42" fill="#0f2740" stroke="url(#amber)" stroke-width="3"/>
    <g transform="translate(42,20)"><polygon points="0,-26 22,-13 22,13 0,26 -22,13 -22,-13" fill="none" stroke="url(#amber)" stroke-width="4"/><text x="0" y="9" text-anchor="middle" font-size="24" font-weight="800" fill="#f0b878">Mg</text></g>
    <text x="108" y="12" font-size="29" font-weight="800" fill="#ffffff">MAGNESIO <tspan fill="#f0b878">· 200 mg</tspan></text>
    <text x="108" y="44" font-size="22" font-weight="500" fill="#aabfd4">Menos fatiga</text>
  </g>
  <!-- VIT D3 -->
  <g transform="translate(452,912)">
    <circle cx="42" cy="20" r="42" fill="#0f2740" stroke="url(#amber)" stroke-width="3"/>
    <g transform="translate(42,20)" stroke="url(#amber)" stroke-width="4" stroke-linecap="round"><circle cx="0" cy="0" r="12" fill="#f0b878" stroke="none"/><line x1="0" y1="-20" x2="0" y2="-28"/><line x1="0" y1="20" x2="0" y2="28"/><line x1="-20" y1="0" x2="-28" y2="0"/><line x1="20" y1="0" x2="28" y2="0"/><line x1="-15" y1="-15" x2="-21" y2="-21"/><line x1="15" y1="-15" x2="21" y2="-21"/><line x1="-15" y1="15" x2="-21" y2="21"/><line x1="15" y1="15" x2="21" y2="21"/></g>
    <text x="108" y="12" font-size="29" font-weight="800" fill="#ffffff">VITAMINA D3 <tspan fill="#f0b878">· 1000 UI</tspan></text>
    <text x="108" y="44" font-size="22" font-weight="500" fill="#aabfd4">Músculo e inmunidad</text>
  </g>

  <!-- brand bottom-left under bottle -->
  <text x="120" y="1006" text-anchor="middle" font-size="20" letter-spacing="3" font-weight="700" fill="#6f86a0">SIN FÓRMULAS SECRETAS</text>
</svg>
