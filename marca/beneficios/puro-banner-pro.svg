<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" font-family="Outfit, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#15314f"/><stop offset="1" stop-color="#0a1726"/>
    </linearGradient>
    <radialGradient id="spot" cx="83%" cy="60%" r="48%">
      <stop offset="0" stop-color="#2E6BD6" stop-opacity="0.40"/>
      <stop offset="1" stop-color="#0a1726" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0b878"/><stop offset="1" stop-color="#d98a3f"/>
    </linearGradient>
    <filter id="cardsh" x="-20%" y="-20%" width="140%" height="170%">
      <feDropShadow dx="0" dy="7" stdDeviation="12" flood-color="#000" flood-opacity="0.28"/>
    </filter>
    <g id="star"><polygon points="12,2 15,9 22,9.3 16.5,14 18.5,21 12,16.8 5.5,21 7.5,14 2,9.3 9,9" fill="#f0b878"/></g>
    <g id="check">
      <circle cx="13" cy="13" r="13" fill="url(#amber)"/>
      <path d="M7 13 l4 4 l8 -9" fill="none" stroke="#0a1726" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </defs>

  <rect width="1080" height="1080" fill="url(#bg)"/>
  <rect width="1080" height="1080" fill="url(#spot)"/>

  <!-- bottle -->
  <image href="bottle-cutout.png" x="744" y="452" width="336" height="570" preserveAspectRatio="xMidYMax meet"/>

  <!-- brand logo -->
  <g transform="translate(60,92)">
    <text x="0" y="0" font-size="50" font-style="italic" font-weight="800" fill="#F8F6F0" letter-spacing="1">PÚRO</text>
    <polygon points="40,-50 58,-66 67,-58 49,-42" fill="url(#amber)"/>
    <text x="150" y="-4" font-size="18" letter-spacing="4" font-weight="600" fill="#7fa6d8">VITALIDAD MASCULINA</text>
  </g>

  <!-- star rating / social proof -->
  <g transform="translate(60,128)">
    <use href="#star" x="0" y="0"/><use href="#star" x="30" y="0"/><use href="#star" x="60" y="0"/><use href="#star" x="90" y="0"/><use href="#star" x="120" y="0"/>
    <text x="166" y="20" font-size="25" font-weight="700" fill="#cfe0f2">4.9/5 · +10.000 hombres ya hicieron el cambio</text>
  </g>

  <!-- headline -->
  <g font-weight="800" font-size="76">
    <text x="58" y="258" fill="#F8F6F0">Menos panza.</text>
    <text x="58" y="346" fill="#F8F6F0">Más energía.</text>
    <text x="58" y="434" fill="#f0b878">Más ganas.</text>
  </g>
  <rect x="60" y="462" width="116" height="6" rx="3" fill="url(#amber)"/>
  <text x="60" y="510" font-size="31" font-weight="600" fill="#bcd0e6">Volvé a sentirte el hombre que eras.</text>

  <!-- benefit cards 2x2 -->
  <g filter="url(#cardsh)">
    <g transform="translate(60,556)">
      <rect width="300" height="142" rx="24" fill="#ffffff"/>
      <text x="30" y="60" font-size="33" font-weight="800" fill="#d57e34">ENERGÍA</text>
      <text x="30" y="103" font-size="26" font-weight="600" fill="#23364d">Adiós a los bajones</text>
    </g>
    <g transform="translate(390,556)">
      <rect width="300" height="142" rx="24" fill="#ffffff"/>
      <text x="30" y="60" font-size="31" font-weight="800" fill="#d57e34">METABOLISMO</text>
      <text x="30" y="103" font-size="26" font-weight="600" fill="#23364d">Apoyá tu figura</text>
    </g>
    <g transform="translate(60,716)">
      <rect width="300" height="142" rx="24" fill="#ffffff"/>
      <text x="30" y="60" font-size="33" font-weight="800" fill="#d57e34">GANAS</text>
      <text x="30" y="103" font-size="26" font-weight="600" fill="#23364d">Volvé a sentirte vos</text>
    </g>
    <g transform="translate(390,716)">
      <rect width="300" height="142" rx="24" fill="#ffffff"/>
      <text x="30" y="60" font-size="33" font-weight="800" fill="#d57e34">DESCANSO</text>
      <text x="30" y="103" font-size="26" font-weight="600" fill="#23364d">Menos estrés</text>
    </g>
  </g>

  <!-- trust chips -->
  <g transform="translate(60,902)" font-size="23" font-weight="700" fill="#dce7f2">
    <use href="#check" x="0" y="-18"/>   <text x="36" y="2">Sin hormonas</text>
    <use href="#check" x="230" y="-18"/> <text x="266" y="2">Industria Argentina</text>
  </g>

  <!-- CTA -->
  <g transform="translate(60,948)">
    <rect width="384" height="80" rx="40" fill="url(#amber)"/>
    <text x="192" y="52" text-anchor="middle" font-size="31" font-weight="800" fill="#0a1726">QUIERO VOLVER A SER YO</text>
  </g>
</svg>
