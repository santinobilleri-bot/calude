<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" font-family="Outfit, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#15314f"/><stop offset="1" stop-color="#0a1726"/>
    </linearGradient>
    <radialGradient id="spot" cx="80%" cy="58%" r="50%">
      <stop offset="0" stop-color="#2E6BD6" stop-opacity="0.40"/>
      <stop offset="1" stop-color="#0a1726" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0b878"/><stop offset="1" stop-color="#d98a3f"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg)"/>
  <rect width="1080" height="1080" fill="url(#spot)"/>

  <!-- title -->
  <text x="60" y="118" font-size="56" font-weight="800" fill="#F8F6F0">CÓMO SE TOMA</text>
  <text x="60" y="170" font-size="29" font-weight="500" fill="#9fb6cf">Tan simple que no tenés excusa.</text>
  <rect x="62" y="196" width="120" height="6" rx="3" fill="url(#amber)"/>

  <!-- bottle right -->
  <image href="bottle-cutout.png" x="700" y="300" width="360" height="640" preserveAspectRatio="xMidYMax meet"/>

  <!-- step 1 -->
  <g transform="translate(70,300)">
    <circle cx="55" cy="55" r="55" fill="url(#amber)"/>
    <text x="55" y="74" text-anchor="middle" font-size="56" font-weight="800" fill="#0a1726">1</text>
    <text x="140" y="46" font-size="38" font-weight="800" fill="#ffffff">Tomá 2 cápsulas</text>
    <text x="140" y="90" font-size="27" font-weight="500" fill="#a9c0d8">con el desayuno.</text>
  </g>

  <!-- step 2 -->
  <g transform="translate(70,470)">
    <circle cx="55" cy="55" r="55" fill="url(#amber)"/>
    <text x="55" y="74" text-anchor="middle" font-size="56" font-weight="800" fill="#0a1726">2</text>
    <text x="140" y="46" font-size="38" font-weight="800" fill="#ffffff">1 vez al día</text>
    <text x="140" y="90" font-size="27" font-weight="500" fill="#a9c0d8">con un vaso de agua.</text>
  </g>

  <!-- step 3 -->
  <g transform="translate(70,640)">
    <circle cx="55" cy="55" r="55" fill="url(#amber)"/>
    <text x="55" y="74" text-anchor="middle" font-size="56" font-weight="800" fill="#0a1726">3</text>
    <text x="140" y="46" font-size="38" font-weight="800" fill="#ffffff">Sé constante</text>
    <text x="140" y="90" font-size="27" font-weight="500" fill="#a9c0d8">en 30-60 días notás el cambio.</text>
  </g>

  <!-- footer -->
  <rect x="0" y="958" width="1080" height="122" fill="#0a1726"/>
  <text x="540" y="1008" text-anchor="middle" font-size="28" font-weight="800" fill="#F8F6F0">Sin dietas imposibles. Sin vivir en el gym.</text>
  <text x="540" y="1046" text-anchor="middle" font-size="21" letter-spacing="2" font-weight="600" fill="#7fa6d8">NATURAL · SIN HORMONAS · SUPLEMENTO DIETARIO</text>
</svg>
