<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" font-family="Outfit, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16314e"/><stop offset="1" stop-color="#091625"/>
    </linearGradient>
    <radialGradient id="glow" cx="82%" cy="62%" r="44%">
      <stop offset="0" stop-color="#2E6BD6" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#091625" stop-opacity="0"/>
    </radialGradient>
    <filter id="cardsh" x="-20%" y="-20%" width="140%" height="170%">
      <feDropShadow dx="0" dy="7" stdDeviation="13" flood-color="#000" flood-opacity="0.32"/>
    </filter>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg)"/>
  <rect width="1080" height="1080" fill="url(#glow)"/>

  <!-- bottle big, bottom-right -->
  <image href="bottle-cutout.png" x="700" y="396" width="402" height="684" preserveAspectRatio="xMidYMax meet"/>

  <!-- kicker -->
  <text x="56" y="84" font-size="31" font-weight="800" fill="#F4F1EA">+10.000 Clientes Satisfechos</text>

  <!-- headline (2 lineas anchas, como MenLab) -->
  <g fill="#F8F6F0" font-weight="800" font-size="60">
    <text x="54" y="172">Confiado por miles de hombres</text>
    <text x="54" y="244">que hicieron el cambio</text>
  </g>
  <text x="56" y="306" font-size="37" font-weight="800" fill="#F8F6F0">¡Sin riesgo, solo resultados!</text>

  <!-- cards 2x2, grandes con aire -->
  <g filter="url(#cardsh)">
    <g transform="translate(56,388)">
      <rect width="300" height="168" rx="24" fill="#ffffff"/>
      <text x="30" y="70" font-size="36" font-weight="800" fill="#d57e34">Energía</text>
      <text x="30" y="116" font-size="26" font-weight="600" fill="#23364d">Más pila todo el día</text>
    </g>
    <g transform="translate(380,388)">
      <rect width="300" height="168" rx="24" fill="#ffffff"/>
      <text x="30" y="70" font-size="34" font-weight="800" fill="#d57e34">Metabolismo</text>
      <text x="30" y="116" font-size="26" font-weight="600" fill="#23364d">Apoya tu figura</text>
    </g>
    <g transform="translate(56,584)">
      <rect width="300" height="168" rx="24" fill="#ffffff"/>
      <text x="30" y="70" font-size="36" font-weight="800" fill="#d57e34">Ánimo</text>
      <text x="30" y="116" font-size="26" font-weight="600" fill="#23364d">Volvé a sentirte vos</text>
    </g>
    <g transform="translate(380,584)">
      <rect width="300" height="168" rx="24" fill="#ffffff"/>
      <text x="30" y="70" font-size="36" font-weight="800" fill="#d57e34">Descanso</text>
      <text x="30" y="116" font-size="26" font-weight="600" fill="#23364d">Dormís mejor</text>
    </g>
  </g>

  <!-- trust -->
  <text x="58" y="828" font-size="29" font-weight="800" fill="#F4F1EA">100% Natural · Sin hormonas · 1 al día</text>
  <text x="58" y="868" font-size="21" letter-spacing="2" font-weight="600" fill="#7fa6d8">SUPLEMENTO DIETARIO · INDUSTRIA ARGENTINA</text>
</svg>
