<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" font-family="Outfit, sans-serif">
  <rect width="1080" height="1080" fill="#ffffff"/>

  <!-- bottle left -->
  <image href="bottle-cutout.png" x="-10" y="300" width="420" height="540" preserveAspectRatio="xMidYMid meet"/>

  <!-- table right -->
  <text x="440" y="318" font-size="28" font-weight="700" fill="#1a1a1a">Ingrediente</text>
  <text x="1024" y="318" text-anchor="end" font-size="28" font-weight="700" fill="#1a1a1a">Por cápsula</text>
  <line x1="440" y1="338" x2="1024" y2="338" stroke="#222" stroke-width="2"/>

  <g font-size="27" fill="#2a2a2a">
    <text x="440" y="392">Ashwagandha KSM-66</text>
    <text x="1024" y="392" text-anchor="end" font-weight="600">300 mg</text>
    <line x1="440" y1="416" x2="1024" y2="416" stroke="#e6e6e6" stroke-width="1.5"/>

    <text x="440" y="458">Maca (extracto 10:1)</text>
    <text x="1024" y="458" text-anchor="end" font-weight="600">150 mg</text>
    <line x1="440" y1="482" x2="1024" y2="482" stroke="#e6e6e6" stroke-width="1.5"/>

    <text x="440" y="524">Tongkat Ali (100:1)</text>
    <text x="1024" y="524" text-anchor="end" font-weight="600">100 mg</text>
    <line x1="440" y1="548" x2="1024" y2="548" stroke="#e6e6e6" stroke-width="1.5"/>

    <text x="440" y="590">Zinc (bisglicinato)</text>
    <text x="1024" y="590" text-anchor="end" font-weight="600">15 mg</text>
    <line x1="440" y1="614" x2="1024" y2="614" stroke="#e6e6e6" stroke-width="1.5"/>

    <text x="440" y="656">Boro (citrato)</text>
    <text x="1024" y="656" text-anchor="end" font-weight="600">3 mg</text>
    <line x1="440" y1="680" x2="1024" y2="680" stroke="#e6e6e6" stroke-width="1.5"/>

    <text x="440" y="722">Vitamina D3</text>
    <text x="1024" y="722" text-anchor="end" font-weight="600">1000 UI</text>
    <line x1="440" y1="746" x2="1024" y2="746" stroke="#e6e6e6" stroke-width="1.5"/>

    <text x="440" y="788">Vitamina B6</text>
    <text x="1024" y="788" text-anchor="end" font-weight="600">1,4 mg</text>
    <line x1="440" y1="812" x2="1024" y2="812" stroke="#e6e6e6" stroke-width="1.5"/>

    <text x="440" y="854">Vitamina B12</text>
    <text x="1024" y="854" text-anchor="end" font-weight="600">2,4 mcg</text>
  </g>

  <text x="440" y="916" font-size="20" fill="#8a8a8a">Tomar 1 cápsula por día · 60 cápsulas por envase · Suplemento dietario</text>
</svg>
