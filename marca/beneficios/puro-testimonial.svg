<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" font-family="Outfit, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#15314f"/><stop offset="1" stop-color="#0a1726"/>
    </linearGradient>
    <radialGradient id="spot" cx="50%" cy="32%" r="55%">
      <stop offset="0" stop-color="#2E6BD6" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#0a1726" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0b878"/><stop offset="1" stop-color="#d98a3f"/>
    </linearGradient>
    <g id="star"><polygon points="12,2 15,9 22,9.3 16.5,14 18.5,21 12,16.8 5.5,21 7.5,14 2,9.3 9,9" fill="#f0b878"/></g>
  </defs>

  <rect width="1080" height="1080" fill="url(#bg)"/>
  <rect width="1080" height="1080" fill="url(#spot)"/>

  <!-- header: logo + stars -->
  <g transform="translate(60,86)">
    <text x="0" y="0" font-size="44" font-style="italic" font-weight="800" fill="#F8F6F0">PÚRO</text>
    <polygon points="35,-44 51,-58 59,-51 43,-37" fill="url(#amber)"/>
  </g>
  <g transform="translate(792,64)">
    <use href="#star" x="0"/><use href="#star" x="36"/><use href="#star" x="72"/><use href="#star" x="108"/><use href="#star" x="144"/>
    <text x="86" y="56" text-anchor="middle" font-size="20" letter-spacing="2" font-weight="700" fill="#7fa6d8">+10.000 hombres</text>
  </g>

  <!-- HERO: el comentario (lo más importante) -->
  <text x="48" y="290" font-size="150" font-weight="800" fill="#1f4a78">“</text>
  <g font-size="50" font-weight="800" fill="#F8F6F0">
    <text x="62" y="280">Bajé la hinchazón y</text>
    <text x="62" y="344">volví a tener energía.</text>
    <text x="62" y="408">A los 52 me siento de</text>
    <text x="62" y="472">40 — y mi señora <tspan fill="#f0b878">lo notó.</tspan></text>
  </g>

  <!-- name -->
  <text x="64" y="548" font-size="26" font-weight="800" fill="#f0b878">— Daniel, 52 · Rosario</text>
  <text x="360" y="548" font-size="24" font-weight="700" fill="#8fd09a">✓ Cliente verificado</text>

  <line x1="62" y1="588" x2="1018" y2="588" stroke="#274463" stroke-width="2"/>

  <!-- bottom row: antes/después + frasco -->
  <!-- before/after boxes -->
  <g>
    <rect x="62" y="624" width="300" height="332" rx="18" fill="#0f2740" stroke="#3a577a" stroke-width="2" stroke-dasharray="9 7"/>
    <rect x="386" y="624" width="300" height="332" rx="18" fill="#0f2740" stroke="#d98a3f" stroke-width="2" stroke-dasharray="9 7"/>
    <text x="212" y="788" text-anchor="middle" font-size="22" font-weight="700" fill="#7e95ad">FOTO DEL CLIENTE</text>
    <text x="536" y="788" text-anchor="middle" font-size="22" font-weight="700" fill="#caa06a">FOTO DEL CLIENTE</text>
    <rect x="62" y="914" width="300" height="42" rx="0 0 18 18" fill="#23364d"/>
    <text x="212" y="942" text-anchor="middle" font-size="22" font-weight="800" fill="#cfe0f2">DÍA 0</text>
    <rect x="386" y="914" width="300" height="42" fill="url(#amber)"/>
    <text x="536" y="942" text-anchor="middle" font-size="22" font-weight="800" fill="#0a1726">DÍA 60</text>
  </g>

  <!-- frasco -->
  <image href="bottle-cutout.png" x="720" y="600" width="320" height="372" preserveAspectRatio="xMidYMax meet"/>

  <!-- footer note -->
  <text x="64" y="1006" font-size="17" font-weight="600" fill="#6f86a0">Plantilla — poné acá la foto real que te manda el cliente.</text>
</svg>
