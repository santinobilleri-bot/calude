<svg width="1080" height="1080" viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FCFBFE"/><stop offset="1" stop-color="#ECE6F4"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B07A38"/><stop offset="0.5" stop-color="#8A4F1E"/><stop offset="1" stop-color="#6E3D17"/>
    </linearGradient>
  </defs>

  <rect width="1080" height="1080" fill="url(#bg)"/>

  <!-- TITULO -->
  <text x="540" y="132" text-anchor="middle" font-family="Georgia,serif" font-size="56" font-weight="700" fill="#33214A">Una cápsula. Nueve activos.</text>
  <text x="540" y="180" text-anchor="middle" font-family="'Helvetica Neue',Arial,sans-serif" font-size="27" fill="#6B6675">Esto tomás cada noche.</text>

  <!-- FRASCO (izquierda) -->
  <g>
    <ellipse cx="250" cy="838" rx="150" ry="26" fill="#000000" opacity="0.10"/>
    <rect x="178" y="306" width="180" height="58" rx="16" fill="#241F2B"/>
    <rect x="160" y="364" width="216" height="456" rx="44" fill="url(#amber)"/>
    <rect x="184" y="384" width="20" height="410" rx="10" fill="#E0B47C" opacity="0.35"/>
    <rect x="160" y="486" width="216" height="218" rx="8" fill="#B7A6C9"/>
    <text x="206" y="612" transform="rotate(-90 206 612)" text-anchor="middle" font-family="Georgia,serif" font-size="74" font-weight="700" fill="#F5EFE6">domi</text>
    <text x="250" y="556" font-family="'Helvetica Neue',Arial,sans-serif" font-size="20" font-weight="700" fill="#33214A">ACTIVADOR</text>
    <text x="250" y="580" font-family="'Helvetica Neue',Arial,sans-serif" font-size="20" font-weight="700" fill="#33214A">DEL SUEÑO</text>
    <line x1="250" y1="598" x2="356" y2="598" stroke="#33214A" stroke-width="1.5" opacity="0.4"/>
    <text x="250" y="636" font-family="'Helvetica Neue',Arial,sans-serif" font-size="17" fill="#4A3A60">60 cápsulas · 60 días</text>
  </g>

  <!-- TABLA (derecha) -->
  <g>
    <rect x="440" y="276" width="576" height="612" rx="24" fill="#FFFFFF" stroke="#E2DAEE" stroke-width="2"/>
    <!-- header -->
    <text x="474" y="338" font-family="'Helvetica Neue',Arial,sans-serif" font-size="29" font-weight="700" fill="#33214A">Ingrediente</text>
    <text x="824" y="338" font-family="'Helvetica Neue',Arial,sans-serif" font-size="29" font-weight="700" fill="#33214A">Por cápsula</text>
    <line x1="440" y1="362" x2="1016" y2="362" stroke="#E2DAEE" stroke-width="2"/>

    <g font-family="'Helvetica Neue',Arial,sans-serif" font-size="26" fill="#33214A">
      <text x="474" y="412">Melatonina</text><text x="824" y="412" font-weight="700">2 mg</text>
      <line x1="474" y1="438" x2="982" y2="438" stroke="#EFEAF5" stroke-width="2"/>
      <text x="474" y="468">L-teanina</text><text x="824" y="468" font-weight="700">100 mg</text>
      <line x1="474" y1="494" x2="982" y2="494" stroke="#EFEAF5" stroke-width="2"/>
      <text x="474" y="524">GABA</text><text x="824" y="524" font-weight="700">100 mg</text>
      <line x1="474" y1="550" x2="982" y2="550" stroke="#EFEAF5" stroke-width="2"/>
      <text x="474" y="580">Glicina</text><text x="824" y="580" font-weight="700">100 mg</text>
      <line x1="474" y1="606" x2="982" y2="606" stroke="#EFEAF5" stroke-width="2"/>
      <text x="474" y="636">Magnesio bisglicinato</text><text x="824" y="636" font-weight="700">100 mg</text>
      <line x1="474" y1="662" x2="982" y2="662" stroke="#EFEAF5" stroke-width="2"/>
      <text x="474" y="692">Pasiflora (extracto)</text><text x="824" y="692" font-weight="700">100 mg</text>
      <line x1="474" y1="718" x2="982" y2="718" stroke="#EFEAF5" stroke-width="2"/>
      <text x="474" y="748">Valeriana (extracto)</text><text x="824" y="748" font-weight="700">100 mg</text>
      <line x1="474" y1="774" x2="982" y2="774" stroke="#EFEAF5" stroke-width="2"/>
      <text x="474" y="804">Ashwagandha (extracto)</text><text x="824" y="804" font-weight="700">120 mg</text>
      <line x1="474" y1="830" x2="982" y2="830" stroke="#EFEAF5" stroke-width="2"/>
      <text x="474" y="860">Vitamina B6</text><text x="824" y="860" font-weight="700">1,4 mg</text>
    </g>
  </g>

  <!-- firma -->
  <text x="540" y="952" text-anchor="middle" font-family="'Helvetica Neue',Arial,sans-serif" font-size="24" fill="#8B7BA5">domi · activador del sueño · suplemento dietario</text>
</svg>
