    <text x="130" y="665" font-family="'Helvetica Neue',Arial,sans-serif" font-size="40" font-weight="700" fill="#F5EFE6">Ashwagandha</text>
    <text x="130" y="720" font-family="'Helvetica Neue',Arial,sans-serif" font-size="34" fill="#CBBEDD">Baja el estrés que te despierta a las 4.</text>

    <rect x="90" y="800" width="900" height="180" rx="22" fill="#FFFFFF" opacity="0.07"/>
    <text x="130" y="875" font-family="'Helvetica Neue',Arial,sans-serif" font-size="40" font-weight="700" fill="#F5EFE6">Magnesio + Pasiflora</text>
    <text x="130" y="930" font-family="'Helvetica Neue',Arial,sans-serif" font-size="34" fill="#CBBEDD">Relajan el cuerpo y la mente.</text>

    <rect x="90" y="1010" width="900" height="180" rx="22" fill="#FFFFFF" opacity="0.07"/>
    <text x="130" y="1085" font-family="'Helvetica Neue',Arial,sans-serif" font-size="40" font-weight="700" fill="#F5EFE6">Valeriana</text>
    <text x="130" y="1140" font-family="'Helvetica Neue',Arial,sans-serif" font-size="34" fill="#CBBEDD">Hace que el sueño sea más profundo.</text>
