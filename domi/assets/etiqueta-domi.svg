<svg width="1400" height="1000" viewBox="0 0 1400 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#B3A0CC"/>
      <stop offset="1" stop-color="#9D86BC"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1400" height="1000" rx="30" fill="url(#bg)"/>

  <!-- domi: vertical wordmark (sin cambios) -->
  <text x="185" y="500" transform="rotate(-90 185 500)" text-anchor="middle"
        font-family="Georgia,serif" font-size="230" font-weight="700" fill="#F5EFE6" letter-spacing="5">domi</text>

  <!-- product name -->
  <text x="440" y="222" font-family="'Helvetica Neue',Arial,sans-serif" font-size="86" font-weight="700" fill="#33214A">ACTIVADOR</text>
  <text x="440" y="308" font-family="'Helvetica Neue',Arial,sans-serif" font-size="86" font-weight="700" fill="#33214A">DEL SUEÑO</text>
  <text x="444" y="366" font-family="Georgia,serif" font-size="40" font-style="italic" fill="#5A416F">Cápsulas blandas</text>

  <!-- divider (color del texto) -->
  <rect x="440" y="404" width="820" height="2" fill="#33214A" opacity="0.4"/>

  <!-- beneficios con viñetas plum -->
  <g font-family="'Helvetica Neue',Arial,sans-serif" font-size="44" font-weight="600" fill="#352447">
    <circle cx="458" cy="498" r="8" fill="#33214A"/><text x="498" y="512">Te dormís en 20 minutos</text>
    <circle cx="458" cy="584" r="8" fill="#33214A"/><text x="498" y="598">Formulado para mujeres</text>
    <circle cx="458" cy="670" r="8" fill="#33214A"/><text x="498" y="684">Baja la ansiedad nocturna</text>
    <circle cx="458" cy="756" r="8" fill="#33214A"/><text x="498" y="770">9 activos · sin resaca</text>
  </g>

  <!-- cantidad -->
  <text x="440" y="902" font-family="'Helvetica Neue',Arial,sans-serif" font-size="32" font-weight="600" fill="#33214A" letter-spacing="1">60 Cápsulas · Suplemento dietario</text>
</svg>
