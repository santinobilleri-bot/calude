<svg width="1400" height="1000" viewBox="0 0 1400 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#B3A0CC"/>
      <stop offset="1" stop-color="#9D86BC"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1400" height="1000" rx="30" fill="url(#bg)"/>

  <!-- domi: GRANDE, ocupa todo el alto (estilo Lipo), sin lineas -->
  <text x="172" y="500" transform="rotate(-90 172 500)" text-anchor="middle"
        font-family="Georgia,serif" font-size="312" font-weight="700" fill="#F5EFE6" letter-spacing="6">domi</text>

  <!-- product name (grande) -->
  <text x="430" y="206" font-family="'Helvetica Neue',Arial,sans-serif" font-size="92" font-weight="700" fill="#33214A">ACTIVADOR</text>
  <text x="430" y="298" font-family="'Helvetica Neue',Arial,sans-serif" font-size="92" font-weight="700" fill="#33214A">DEL SUEÑO</text>
  <text x="434" y="356" font-family="Georgia,serif" font-size="40" font-style="italic" fill="#5A416F">Cápsulas blandas</text>

  <!-- LINEA 1 (bajo el nombre) -->
  <rect x="430" y="392" width="852" height="2" fill="#33214A" opacity="0.4"/>

  <!-- beneficios GRANDES, sin viñetas, sin tiempo -->
  <g font-family="'Helvetica Neue',Arial,sans-serif" font-size="47" font-weight="600" fill="#33214A">
    <text x="430" y="480">Favorece el sueño profundo</text>
    <text x="430" y="562">Formulado para mujeres</text>
    <text x="430" y="644">Reduce la ansiedad nocturna</text>
    <text x="430" y="726">9 activos · sin resaca</text>
  </g>

  <!-- LINEA 2 (arriba de la cantidad) -->
  <rect x="430" y="784" width="852" height="2" fill="#33214A" opacity="0.4"/>

  <!-- cantidad -->
  <text x="430" y="852" font-family="'Helvetica Neue',Arial,sans-serif" font-size="32" font-weight="600" fill="#33214A" letter-spacing="1">60 Cápsulas · Suplemento dietario</text>
</svg>
