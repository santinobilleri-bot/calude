<svg width="1400" height="1000" viewBox="0 0 1400 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#B3A0CC"/>
      <stop offset="1" stop-color="#9D86BC"/>
    </linearGradient>
  </defs>

  <!-- label background -->
  <rect x="0" y="0" width="1400" height="1000" rx="34" fill="url(#bg)"/>

  <!-- LEFT: huge vertical wordmark (Lipo-style), spanning full height -->
  <text x="232" y="500" transform="rotate(-90 232 500)" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif" font-size="280" font-weight="700"
        fill="#F5EFE6" letter-spacing="6">domi</text>

  <!-- thin cream divider between wordmark and content -->
  <rect x="452" y="120" width="3" height="760" fill="#F5EFE6" opacity="0.6"/>

  <!-- RIGHT: content starts at TOP -->
  <g>
    <!-- product name (top) -->
    <text x="520" y="210" font-family="'Helvetica Neue', Arial, sans-serif" font-size="94"
          font-weight="700" fill="#33214A" letter-spacing="1">ACTIVADOR</text>
    <text x="520" y="302" font-family="'Helvetica Neue', Arial, sans-serif" font-size="94"
          font-weight="700" fill="#33214A" letter-spacing="1">DEL SUEÑO</text>
    <text x="524" y="362" font-family="Georgia, serif" font-size="42" font-style="italic"
          fill="#5A416F">Cápsulas blandas</text>

    <!-- divider -->
    <rect x="524" y="398" width="800" height="3" fill="#33214A" opacity="0.4"/>

    <!-- benefits (Lipo-style: clean bold lines, no bullets) -->
    <g font-family="'Helvetica Neue', Arial, sans-serif" font-size="46" font-weight="600" fill="#352447">
      <text x="524" y="500">Te dormís en 20 minutos</text>
      <text x="524" y="588">Formulado para mujeres</text>
      <text x="524" y="676">Baja la ansiedad nocturna</text>
      <text x="524" y="764">9 activos · sin resaca</text>
    </g>

    <!-- bottom: count centered with short rules -->
    <rect x="524" y="852" width="40" height="2" fill="#33214A" opacity="0.45"/>
    <rect x="1284" y="852" width="40" height="2" fill="#33214A" opacity="0.45"/>
    <text x="924" y="864" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif"
          font-size="32" font-weight="600" fill="#33214A" letter-spacing="1">60 Cápsulas · Suplemento dietario</text>
  </g>
</svg>
