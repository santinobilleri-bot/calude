</defs><rect width="1080" height="1920" fill="url(#bg)"/><text x="90" y="430" font-family="Arial" font-size="96" font-weight="900" fill="#F5EFE6">Qué hace</text><text x="90" y="540" font-family="Arial" font-size="96" font-weight="900" fill="#C9B3E6">por vos</text><rect x="80" y="680" width="920" height="230" rx="28" fill="#fff" opacity="0.07"/><text x="130" y="775" font-family="Arial" font-size="48" font-weight="800" fill="#F5EFE6">Te dormís rápido</text><text x="130" y="842" font-family="Arial" font-size="38" fill="#B9A7D6">Sin dar vueltas en la cama</text><rect x="80" y="950" width="920" height="230" rx="28" fill="#fff" opacity="0.07"/><text x="130" y="1045" font-family="Arial" font-size="48" font-weight="800" fill="#F5EFE6">Dormís toda la noche</text><text x="130" y="1112" font-family="Arial" font-size="38" fill="#B9A7D6">Sin despertarte a las 4</text><rect x="80" y="1220" width="920" height="230" rx="28" fill="#fff" opacity="0.07"/><text x="130" y="1315" font-family="Arial" font-size="48" font-weight="800" fill="#F5EFE6">Despertás descansada</text><text x="130" y="1382" font-family="Arial" font-size="38" fill="#B9A7D6">Sin resaca, con energía</text></svg>