<svg width="1080" height="1080" viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgp" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#31204A"/>
      <stop offset="1" stop-color="#1F1430"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B07A38"/>
      <stop offset="0.5" stop-color="#8A4F1E"/>
      <stop offset="1" stop-color="#6E3D17"/>
    </linearGradient>
    <linearGradient id="av" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C9A8D8"/>
      <stop offset="1" stop-color="#8E6FB0"/>
    </linearGradient>
    <g id="star">
      <polygon points="0,-18 4.11,-5.66 17.1,-5.56 6.66,2.16 10.58,14.56 0,7 -10.58,14.56 -6.66,2.16 -17.1,-5.56 -4.11,-5.66" fill="#E6B45A"/>
    </g>
  </defs>

  <rect width="1080" height="1080" fill="url(#bgp)"/>
  <circle cx="980" cy="120" r="150" fill="#FFFFFF" opacity="0.04"/>
  <circle cx="930" cy="95" r="150" fill="#31204A" opacity="0.5"/>

  <!-- HEADLINE -->
  <text x="72" y="150" font-family="Georgia,serif" font-size="58" font-weight="700" fill="#F5EFE6">De noches en vela</text>
  <text x="72" y="220" font-family="Georgia,serif" font-size="58" font-weight="700" fill="#C9B3E6">a dormir de corrido.</text>

  <!-- estrellas -->
  <use href="#star" x="96" y="270"/>
  <use href="#star" x="144" y="270"/>
  <use href="#star" x="192" y="270"/>
  <use href="#star" x="240" y="270"/>
  <use href="#star" x="288" y="270"/>
  <text x="324" y="282" font-family="'Helvetica Neue',Arial,sans-serif" font-size="26" fill="#CBBEDD">Reseña real de una clienta</text>

  <!-- ====== TARJETA COMENTARIO FACEBOOK ====== -->
  <g>
    <rect x="72" y="332" width="936" height="408" rx="26" fill="#FFFFFF"/>
    <!-- avatar -->
    <circle cx="148" cy="402" r="44" fill="url(#av)"/>
    <text x="148" y="414" text-anchor="middle" font-family="'Helvetica Neue',Arial,sans-serif" font-size="34" font-weight="700" fill="#FFFFFF">ML</text>
    <!-- nombre + meta -->
    <text x="212" y="392" font-family="'Helvetica Neue',Arial,sans-serif" font-size="31" font-weight="700" fill="#050505">María Laura G.</text>
    <text x="212" y="426" font-family="'Helvetica Neue',Arial,sans-serif" font-size="23" fill="#65676B">2 semanas</text>

    <!-- texto del comentario -->
    <g font-family="'Helvetica Neue',Arial,sans-serif" font-size="30" fill="#1C1E21">
      <text x="80" y="500">Chicas, de verdad no lo podía creer. Hacía meses que</text>
      <text x="80" y="544">me despertaba a las 4 de la mañana con el corazón a mil.</text>
      <text x="80" y="588">Empecé con domi y a la semana ya dormía de corrido.</text>
      <text x="80" y="632">Me levanto descansada y con paciencia. Volví a ser yo.</text>
    </g>
    <path d="M820 624 C814 614 798 616 802 628 C805 637 820 648 820 648 C820 648 835 637 838 628 C842 616 826 614 820 624 Z" fill="#8E6FB0"/>

    <!-- reacciones -->
    <circle cx="96" cy="694" r="17" fill="#1877F2"/>
    <path d="M89 692 h4 v8 h-4 z M95 691 c0-3 4-6 5-9 c1-2 4-1 3 2 l-1 4 h6 c2 0 3 2 2 4 l-2 6 c-1 2-2 3-4 3 h-9 z" fill="#FFFFFF"/>
    <circle cx="120" cy="694" r="17" fill="#F33E58"/>
    <path d="M120 690 C117 685 109 686 111 693 C113 698 120 703 120 703 C120 703 127 698 129 693 C131 686 123 685 120 690 Z" fill="#FFFFFF"/>
    <text x="150" y="703" font-family="'Helvetica Neue',Arial,sans-serif" font-size="25" fill="#65676B">128</text>
    <text x="640" y="703" font-family="'Helvetica Neue',Arial,sans-serif" font-size="25" font-weight="700" fill="#65676B">Me gusta · Responder</text>
  </g>

  <!-- ====== PRODUCTO (firma abajo) ====== -->
  <g>
    <rect x="150" y="822" width="86" height="26" rx="9" fill="#241F2B"/>
    <rect x="135" y="848" width="116" height="170" rx="20" fill="url(#amber)"/>
    <rect x="135" y="900" width="116" height="92" rx="6" fill="#B7A6C9"/>
    <text x="166" y="946" transform="rotate(-90 166 946)" text-anchor="middle" font-family="Georgia,serif" font-size="40" font-weight="700" fill="#F5EFE6">domi</text>
    <text x="210" y="930" font-family="'Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="700" fill="#31204A">ACTIVADOR</text>
    <text x="210" y="948" font-family="'Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="700" fill="#31204A">DEL SUEÑO</text>
  </g>
  <text x="300" y="905" font-family="Georgia,serif" font-size="64" font-weight="700" fill="#F5EFE6">domi</text>
  <text x="302" y="952" font-family="'Helvetica Neue',Arial,sans-serif" font-size="28" fill="#C9B3E6">Activador del sueño · Suplemento dietario</text>
</svg>
